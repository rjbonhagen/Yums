name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint --workspace apps/web
      # next build also typechecks the whole apps/web project. No env vars
      # required — the app runs on mock/reference data and honest fallbacks
      # without Supabase/Google/OpenAI/Mapbox keys configured (see
      # apps/web/.env.example).
      - run: npm run build --workspace apps/web
