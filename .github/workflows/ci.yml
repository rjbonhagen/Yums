name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:pilot-config
      - run: npm run lint --workspace apps/web
      # next build also typechecks the whole apps/web project. No env vars
      # required for compilation. Live discovery remains available without
      # optional account, Calendar, chat, or map configuration.
      - run: npm run build --workspace apps/web
